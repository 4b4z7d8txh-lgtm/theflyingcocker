<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #fff;
      color: #222;
    }
    form { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 280px; }
    input, button { font: inherit; padding: 8px 10px; }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }
    .error { margin: 0; font-size: 13px; color: #b23b2e; }
  </style>
</head>
<body>
  <form id="login-form" novalidate>
    <label for="fc-user" class="visually-hidden">Username</label>
    <input id="fc-user" type="text" autocomplete="username"
           placeholder="Username" required autofocus />

    <label for="fc-pass" class="visually-hidden">Password</label>
    <input id="fc-pass" type="password" autocomplete="current-password"
           placeholder="Password" required />

    <p id="error" class="error" role="alert" hidden></p>

    <button type="submit">Log in</button>
  </form>

  <script type="module">
    import { firebaseConfig } from './assets/firebase-config.js';
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import {
      getAuth, signInWithEmailAndPassword, onAuthStateChanged, setPersistence,
      browserSessionPersistence
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    const auth = getAuth(initializeApp(firebaseConfig));
    // Keep the session only until the browser tab is closed.
    setPersistence(auth, browserSessionPersistence);

    const form = document.getElementById('login-form');
    const error = document.getElementById('error');
    const button = form.querySelector('button');

    // Where to go after login. The subdomains (ob., wf.) send people here with
    // ?next=<address they wanted>. Only our own sites are accepted, so this
    // page can't be used to bounce someone to a stranger's website.
    function destination() {
      const next = new URLSearchParams(location.search).get('next');
      if (next) {
        try {
          const u = new URL(next);
          if (u.protocol === 'https:' &&
              (u.hostname === 'theflyingcocker.co.uk' ||
               u.hostname.endsWith('.theflyingcocker.co.uk'))) {
            return u.href;
          }
        } catch (e) { /* ignore a malformed address */ }
      }
      return 'members.html';
    }

    // Turn the Firebase login into the fc_session cookie that ob. and wf.
    // check (handled by the fc-auth service on the server, at /auth/session).
    async function startSiteSession(user) {
      const idToken = await user.getIdToken();
      const res = await fetch('/auth/session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idToken }),
      });
      if (!res.ok) throw new Error('session ' + res.status);
    }

    let busy = false;

    // If already signed in, refresh the cookie and carry on to the destination.
    onAuthStateChanged(auth, async (user) => {
      if (!user || busy) return;
      busy = true;
      try { await startSiteSession(user); } catch (e) { /* members page still works */ }
      window.location.replace(destination());
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.hidden = true;
      const email = document.getElementById('fc-user').value.trim();
      const password = document.getElementById('fc-pass').value;

      busy = true;
      button.disabled = true;
      button.textContent = 'Signing in…';
      let cred;
      try {
        cred = await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        busy = false;
        // Show one generic message so we don't reveal which field was wrong.
        error.textContent = 'Incorrect username or password.';
        error.hidden = false;
        const pass = document.getElementById('fc-pass');
        pass.value = '';
        pass.focus();
        button.disabled = false;
        button.textContent = 'Log in';
        return;
      }
      try { await startSiteSession(cred.user); } catch (e) { /* members page still works */ }
      window.location.href = destination();
    });
  </script>
</body>
</html>
