<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Flying Cocker &middot; Members</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Work+Sans:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="assets/members.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-inner">
        <span class="brand">
          <img src="assets/img/portrait.jpg" alt="" />
          The Flying Cocker
        </span>
        <nav class="nav">
          <a href="members.html" class="active">Home</a>
          <a href="minecraps.html">Minecraps</a>
        </nav>
        <div class="topbar-right">
          <span id="welcome" class="welcome"></span>
          <button id="signout" class="signout">Sign out</button>
        </div>
      </div>
    </header>

    <main class="content" role="main">
      <p class="eyebrow">Members area</p>
      <h1 id="heading">Welcome</h1>
      <div id="body" class="body muted">Loading…</div>
    </main>

    <footer class="footer">The Flying Cocker &middot; Members area</footer>
  </div>

  <script type="module">
    import { guardMembersPage } from './assets/members-guard.js';
    import {
      getFirestore, doc, getDoc
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    const heading = document.getElementById('heading');
    const bodyEl = document.getElementById('body');

    // The shared guard checks the login, reveals the page and wires sign-out.
    // Once a signed-in user is confirmed, load the PRIVATE content from
    // Firestore. The security rules only allow this read for a signed-in user,
    // so the content is never exposed to the public — even though this HTML
    // file is.
    guardMembersPage(async (user, app) => {
      const db = getFirestore(app);
      try {
        const snap = await getDoc(doc(db, 'members', 'home'));
        if (snap.exists()) {
          const data = snap.data();
          heading.textContent = data.heading || 'Welcome to the club';
          bodyEl.textContent = data.body || '';
          bodyEl.classList.remove('muted');
        } else {
          heading.textContent = 'Welcome to the club';
          bodyEl.textContent = 'No content yet. Add a document at members/home in '
            + 'Firestore (see SETUP.md) and it will appear here.';
        }
      } catch (err) {
        bodyEl.textContent = 'Could not load members content. Check your Firestore '
          + 'rules and that the members/home document exists (see SETUP.md).';
      }
    });
  </script>
</body>
</html>
